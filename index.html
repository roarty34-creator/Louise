<!DOCTYPE html>
<html>
<head>
  <title>Tanya Client Portal</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <section id="home">
      <h1>Tanya Client Portal</h1>
      <p>Welkom. Hierdie portaal gee jou toegang tot jou goedgekeurde modules en worksheets.</p>

      <div id="loginBox">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
      </div>

      <button id="logoutBtn" onclick="logout()" hidden>Logout</button>
    </section>

    <section id="modules"></section>
    <section id="weeks"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
